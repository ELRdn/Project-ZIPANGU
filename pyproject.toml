[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-zipangu"
version = "0.0.1"
description = "Reproducible low-cost Japanese LLM post-training research."
requires-python = ">=3.11,<3.14"
dependencies = ["pyyaml>=6.0.2", "rich>=14.0.0"]

[project.optional-dependencies]
train = [
  "transformers==5.16.1",
  "trl==1.12.0",
  "peft==0.20.0",
  "datasets==5.0.1",
  "accelerate==1.14.0",
  "huggingface-hub>=0.35.0",
  "safetensors>=0.6.0",
]
audit = ["pyarrow>=17.0"]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
